<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Trouveur d'Alternance</title>
    <style>
        /* Garde ton CSS ici */
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 20px; }
        .job-card { background: #1e293b; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid #6366f1; }
        .search-box { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 10px; }
        input, button { padding: 10px; border-radius: 5px; border: none; }
        button { background: #6366f1; color: white; cursor: pointer; font-weight: bold; }
        .job-link { color: #10b981; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div style="max-width: 800px; margin: 0 auto;">
        <h1 style="text-align: center;">🚀 Alternance Search</h1>
        
        <div class="search-box">
            <input type="text" id="domain" placeholder="Métier" value="Ressources Humaines" style="flex: 2;">
            <input type="text" id="location" placeholder="Ville" value="Marseille" style="flex: 1;">
            <button onclick="searchJobs()">Lancer la recherche</button>
        </div>

        <div id="stats" style="margin-bottom: 10px; color: #94a3b8;">Offres trouvées : <span id="totalJobs">0</span></div>
        <div id="loading" style="display:none; text-align: center;">⌛ Recherche en cours...</div>
        <div id="results"></div>
    </div>

    <script>
        let allJobs = [];
        const APP_ID = '48757112';
        const APP_KEY = 'a203ff7d66ab6e9f492f053751d9b188';

        async function searchJobs() {
            const domain = document.getElementById('domain').value;
            const location = document.getElementById('location').value;
            const resultsDiv = document.getElementById('results');
            const loading = document.getElementById('loading');
            
            resultsDiv.innerHTML = '';
            loading.style.display = 'block';
            allJobs = [];

            // On ajoute "alternance" à la requête pour filtrer les résultats
            const url = `https://api.adzuna.com/v1/api/jobs/fr/search/1?app_id=${APP_ID}&app_key=${APP_KEY}&results_per_page=15&what=${encodeURIComponent(domain + " alternance")}&where=${encodeURIComponent(location)}&content-type=application/json`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    data.results.forEach(job => {
                        allJobs.push(job);
                        const card = document.createElement('div');
                        card.className = 'job-card';
                        card.innerHTML = `
                            <h3 style="margin-top:0">${job.title}</h3>
                            <p><strong>🏢 ${job.company.display_name}</strong> | 📍 ${job.location.display_name}</p>
                            <p style="font-size:0.9rem; color:#cbd5e1">${job.description.substring(0, 150)}...</p>
                            <a href="${job.redirect_url}" target="_blank" class="job-link">Voir l'offre →</a>
                        `;
                        resultsDiv.appendChild(card);
                    });
                } else {
                    resultsDiv.innerHTML = "<p>Désolé, aucune offre trouvée. Essaie un mot-clé plus simple.</p>";
                }
            } catch (error) {
                alert("Erreur de connexion à l'API.");
                console.error(error);
            } finally {
                loading.style.display = 'none';
                document.getElementById('totalJobs').textContent = allJobs.length;
            }
        }
    </script>
</body>
</html>
