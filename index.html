<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 MOMOJOB | Ultimate Experience</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #818cf8; --primary-dark: #6366f1; --accent: #c084fc;
            --bg: #0b0e14; --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc; --text-sub: #94a3b8; --border: rgba(255, 255, 255, 0.1);
            --glass: rgba(15, 23, 42, 0.95);
        }

        [data-theme="light"] {
            --bg: #f8fafc; --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b; --text-sub: #64748b; --border: rgba(0, 0, 0, 0.1);
            --glass: rgba(255, 255, 255, 0.98);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-main); 
            margin: 0; transition: 0.4s; min-height: 100vh; overflow-x: hidden;
        }

        /* Progress Bar */
        #progress-bar-container { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: transparent; z-index: 2000; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(to right, var(--primary), var(--accent)); box-shadow: 0 0 10px var(--primary); transition: width 0.4s; }

        /* Header Responsive */
        header {
            padding: 15px 0; background: var(--glass); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000;
        }

        .header-content { 
            max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; 
            justify-content: space-between; align-items: center; padding: 0 20px; gap: 15px;
        }

        .logo { font-size: 1.4rem; font-weight: 800; background: linear-gradient(to right, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap; }

        .search-wrapper { 
            display: flex; background: rgba(0,0,0,0.15); padding: 5px; border-radius: 14px; 
            border: 1px solid var(--border); gap: 5px; flex: 2; min-width: 300px;
        }
        .search-wrapper input { background: transparent; border: none; color: var(--text-main); padding: 10px; outline: none; width: 100%; font-size: 0.9rem; }
        .search-btn { background: var(--primary-dark); color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; white-space: nowrap; }

        /* Main Layout */
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }

        .top-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        #count-badge { background: var(--primary); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; display: none; }

        /* Grid System Responsive */
        .results-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); 
            gap: 20px; 
        }

        .job-card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 22px;
            padding: 25px; transition: 0.3s; animation: slideUp 0.5s ease-out both;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .job-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 15px 35px rgba(0,0,0,0.25); }

        .job-title { font-size: 1.2rem; color: var(--text-main); margin: 0; font-weight: 700; line-height: 1.3; }
        .company-name { color: var(--primary); font-weight: 600; font-size: 0.95rem; margin-top: 6px; display: block; }

        .badges { display: flex; gap: 8px; margin: 15px 0; flex-wrap: wrap; }
        .badge { background: rgba(129, 140, 248, 0.08); padding: 6px 12px; border-radius: 10px; font-size: 0.75rem; color: var(--text-sub); border: 1px solid var(--border); }

        .job-description { color: var(--text-sub); font-size: 0.9rem; line-height: 1.6; margin-bottom: 20px; flex-grow: 1; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .apply-btn { 
            background: linear-gradient(135deg, var(--primary-dark), var(--accent)); color: white; 
            text-decoration: none; padding: 12px 25px; border-radius: 12px; font-weight: 700; font-size: 0.9rem;
        }

        /* Mobile Specific Adjustments */
        @media (max-width: 768px) {
            .results-grid { grid-template-columns: 1fr; }
            .header-content { padding: 10px 15px; }
            .search-wrapper { order: 3; width: 100%; min-width: 100%; margin: 0; }
            .job-card { padding: 20px; }
            .logo { font-size: 1.2rem; }
        }

        @media (max-width: 480px) {
            .card-footer { flex-direction: column; gap: 15px; align-items: stretch; }
            .apply-btn { text-align: center; }
            .top-actions { flex-direction: column; align-items: flex-start; }
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="progress-bar-container"><div id="progress-bar"></div></div>

    <header>
        <div class="header-content">
            <div class="logo"><i class="fas fa-bolt"></i> MOMO<span>JOB</span></div>
            <div class="search-wrapper">
                <input type="text" id="domain" placeholder="Métier (ex: Dev)" value="Développeur">
                <input type="text" id="location" placeholder="Ville" value="Marseille">
                <button class="search-btn" onclick="searchJobs()"><i class="fas fa-search"></i></button>
            </div>
            <button onclick="toggleTheme()" style="background:none; border:none; color:var(--text-main); cursor:pointer; font-size:1.1rem;"><i class="fas fa-circle-half-stroke"></i></button>
        </div>
    </header>

    <div class="container">
        <div class="top-actions">
            <div>
                <span id="count-badge"></span>
            </div>
            <button id="export-btn" onclick="exportToCSV()" style="display:none; background:transparent; border:1px solid var(--border); color:var(--text-sub); padding:8px 15px; border-radius:10px; cursor:pointer;">
                <i class="fas fa-download"></i> Export CSV
            </button>
        </div>

        <div id="results" class="results-grid">
            <div style="grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: var(--text-sub);">
                <i class="fas fa-briefcase" style="font-size: 3rem; margin-bottom: 20px; opacity: 0.2;"></i>
                <h2>Prêt pour une nouvelle aventure ?</h2>
                <p>Momo est là pour te trouver le contrat idéal.</p>
            </div>
        </div>
    </div>

    <script>
        let currentJobs = [];

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
        }

        function copyLink(url) {
            navigator.clipboard.writeText(url);
            // On peut ajouter un toast discret ici si on veut
        }

        function exportToCSV() {
            if (currentJobs.length === 0) return;
            let csvContent = "data:text/csv;charset=utf-8,Titre,Entreprise,Lieu,Lien\n";
            currentJobs.forEach(j => {
                csvContent += `"${j.title}","${j.company.display_name}","${j.location.display_name}","${j.redirect_url}"\n`;
            });
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", "momo_export.csv");
            link.click();
        }

        async function searchJobs() {
            const domain = document.getElementById('domain').value;
            const location = document.getElementById('location').value;
            const resultsDiv = document.getElementById('results');
            const progressBar = document.getElementById('progress-bar');
            const exportBtn = document.getElementById('export-btn');
            const countBadge = document.getElementById('count-badge');

            resultsDiv.innerHTML = '';
            exportBtn.style.display = 'none';
            countBadge.style.display = 'none';
            progressBar.style.width = '30%';

            const ADZUNA_ID = '48757112';
            const ADZUNA_KEY = 'a203ff7d66ab6e9f492f053751d9b188';

            try {
                const url = `https://api.adzuna.com/v1/api/jobs/fr/search/1?app_id=${ADZUNA_ID}&app_key=${ADZUNA_KEY}&results_per_page=20&what=${encodeURIComponent(domain + " alternance")}&where=${encodeURIComponent(location)}&content-type=application/json`;
                
                const response = await fetch(url);
                const data = await response.json();
                progressBar.style.width = '100%';

                if (data.results && data.results.length > 0) {
                    currentJobs = data.results;
                    exportBtn.style.display = 'block';
                    countBadge.textContent = `${data.results.length} offres trouvées`;
                    countBadge.style.display = 'inline-block';

                    data.results.forEach((job, i) => {
                        const card = document.createElement('div');
                        card.className = 'job-card';
                        card.style.animationDelay = (i * 0.08) + 's';
                        card.innerHTML = `
                            <div>
                                <h3 class="job-title">${job.title}</h3>
                                <span class="company-name"><i class="fas fa-building"></i> ${job.company.display_name}</span>
                                <div class="badges">
                                    <div class="badge"><i class="fas fa-map-marker-alt"></i> ${job.location.display_name}</div>
                                    <div class="badge"><i class="fas fa-graduation-cap"></i> Alternance</div>
                                </div>
                                <p class="job-description">${job.description.replace(/<[^>]*>?/gm, '').substring(0, 160)}...</p>
                            </div>
                            <div class="card-footer">
                                <a href="${job.redirect_url}" target="_blank" class="apply-btn">Postuler</a>
                                <button onclick="copyLink('${job.redirect_url}')" style="background:none; border:none; color:var(--text-sub); cursor:pointer;" title="Copier le lien"><i class="fas fa-share-nodes"></i></button>
                            </div>
                        `;
                        resultsDiv.appendChild(card);
                    });
                } else {
                    resultsDiv.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px;">Aucun résultat trouvé pour cette zone.</div>`;
                }
            } catch (e) { console.error(e); } 
            finally { setTimeout(() => progressBar.style.width = '0%', 600); }
        }
    </script>
</body>
</html>
