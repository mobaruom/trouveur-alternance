<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 MOMOJOB | Premium Search</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #818cf8;
            --primary-dark: #6366f1;
            --accent: #c084fc;
            --bg: #0b0e14;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --glass: rgba(15, 23, 42, 0.8);
        }

        [data-theme="light"] {
            --bg: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: rgba(0, 0, 0, 0.05);
            --glass: rgba(255, 255, 255, 0.9);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg);
            background-image: radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 25%),
                              radial-gradient(circle at 100% 100%, rgba(192, 132, 252, 0.15) 0%, transparent 25%);
            color: var(--text-main); 
            margin: 0; 
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 100vh;
        }

        /* Header avec effet de flou (Glassmorphism) */
        header {
            padding: 15px 0;
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Barre de recherche stylisée */
        .search-wrapper {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            padding: 5px;
            border-radius: 14px;
            border: 1px solid var(--border);
            gap: 5px;
            width: 100%;
            max-width: 600px;
        }

        .search-wrapper input {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 10px 15px;
            outline: none;
            width: 100%;
            font-size: 0.95rem;
        }

        .search-btn {
            background: linear-gradient(135deg, var(--primary-dark), var(--accent));
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        /* Conteneur principal */
        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Cartes d'offres Premium */
        .job-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 25px;
            transition: 0.4s;
            backdrop-filter: blur(5px);
            animation: slideUp 0.5s ease-out forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .job-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px) scale(1.01);
            background: rgba(30, 41, 59, 0.9);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .job-title {
            font-size: 1.4rem;
            color: var(--text-main);
            margin: 0;
            font-weight: 700;
        }

        .company-name {
            color: var(--primary);
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }

        .badges {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.8rem;
            color: var(--text-sub);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge i { color: var(--accent); }

        .job-description {
            color: var(--text-sub);
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 20px 0;
        }

        .apply-btn {
            background: rgba(129, 140, 248, 0.1);
            color: var(--primary);
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 700;
            display: inline-block;
            transition: 0.3s;
            border: 1px solid rgba(129, 140, 248, 0.2);
        }

        .apply-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateX(5px);
        }

        /* Loading Spinner */
        .loader {
            display: none;
            width: 50px;
            height: 50px;
            border: 3px solid var(--border);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
            margin: 50px auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .header-content { flex-direction: column; gap: 20px; }
            .search-wrapper { flex-direction: column; background: transparent; border: none; }
            .search-wrapper input { background: var(--card-bg); border-radius: 10px; margin-bottom: 5px; border: 1px solid var(--border); }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-rocket"></i> MOMO<span>JOB</span>
            </div>
            <div class="search-wrapper">
                <input type="text" id="domain" placeholder="Quel métier ?" value="Développeur">
                <input type="text" id="location" placeholder="Quelle ville ?" value="Paris">
                <button class="search-btn" onclick="searchJobs()">Explorer</button>
            </div>
            <button onclick="toggleTheme()" style="background:none; border:none; color:var(--text-main); cursor:pointer; font-size:1.2rem;">
                <i class="fas fa-circle-half-stroke"></i>
            </button>
        </div>
    </header>

    <div class="container">
        <div id="loader" class="loader"></div>
        <div id="results">
            <div style="text-align: center; margin-top: 100px; color: var(--text-sub);">
                <i class="fas fa-search" style="font-size: 3rem; margin-bottom: 20px; opacity: 0.3;"></i>
                <p>Lance une recherche pour découvrir les meilleures alternances.</p>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
        }

        async function searchJobs() {
            const domain = document.getElementById('domain').value;
            const location = document.getElementById('location').value;
            const resultsDiv = document.getElementById('results');
            const loader = document.getElementById('loader');

            if(!domain) return;

            resultsDiv.innerHTML = '';
            loader.style.display = 'block';

            const ADZUNA_ID = '48757112';
            const ADZUNA_KEY = 'a203ff7d66ab6e9f492f053751d9b188';

            try {
                const url = `https://api.adzuna.com/v1/api/jobs/fr/search/1?app_id=${ADZUNA_ID}&app_key=${ADZUNA_KEY}&results_per_page=15&what=${encodeURIComponent(domain + " alternance")}&where=${encodeURIComponent(location)}&content-type=application/json`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    data.results.forEach((job, index) => {
                        const sector = job.location.area ? job.location.area[1] || job.location.area[0] : "France";
                        const card = document.createElement('div');
                        card.className = 'job-card';
                        card.style.animationDelay = (index * 0.1) + 's';
                        card.innerHTML = `
                            <div class="job-header">
                                <div>
                                    <h3 class="job-title">${job.title}</h3>
                                    <div class="company-name"><i class="fas fa-building"></i> ${job.company.display_name}</div>
                                </div>
                            </div>
                            <div class="badges">
                                <div class="badge"><i class="fas fa-map-marker-alt"></i> ${job.location.display_name}</div>
                                <div class="badge"><i class="fas fa-layer-group"></i> ${sector}</div>
                                <div class="badge"><i class="fas fa-clock"></i> Alternance</div>
                            </div>
                            <p class="job-description">${job.description.replace(/<[^>]*>?/gm, '').substring(0, 200)}...</p>
                            <a href="${job.redirect_url}" target="_blank" class="apply-btn">Découvrir l'offre <i class="fas fa-arrow-right"></i></a>
                        `;
                        resultsDiv.appendChild(card);
                    });
                } else {
                    resultsDiv.innerHTML = "<p style='text-align:center;'>Aucune pépite trouvée ici...</p>";
                }
            } catch (e) {
                resultsDiv.innerHTML = "<p style='text-align:center;'>Oups, erreur réseau.</p>";
            } finally {
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
