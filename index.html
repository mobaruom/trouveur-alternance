<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MJob | By Momo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --p: #8b5cf6; 
            --bg: #0f172a; 
            --surface: #1e293b; 
            --border: #334155;
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 40px; transition: background 0.5s ease; }

        header {
            background: var(--surface);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }

        .brand { font-size: 1.8rem; font-weight: 900; letter-spacing: -1.5px; }
        .brand span { color: var(--p); }
        .by-momo { font-family: 'Dancing Script', cursive; color: var(--p); font-size: 1.2rem; margin-left: 10px; }

        .search-container { padding: 2rem 1rem; max-width: 800px; margin: 0 auto; }
        .search-card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .input-group { margin-bottom: 1rem; flex: 1; }
        .input-group label { display: block; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 5px; text-transform: uppercase; font-weight: 700; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--p); }
        
        input {
            width: 100%; background: #0f172a; border: 1px solid var(--border);
            padding: 14px 14px 14px 40px; color: white; border-radius: 10px;
            font-size: 1rem; transition: 0.3s;
        }
        input:focus { border-color: var(--p); outline: none; }

        .btn-search {
            width: 100%; background: var(--p); color: white; border: none;
            padding: 16px; border-radius: 10px; font-weight: 800;
            cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .time-filters {
            display: flex; justify-content: center; gap: 10px; margin-bottom: 1.5rem;
        }
        .filter-btn {
            background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
            padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .filter-btn.active { background: var(--p); color: white; border-color: var(--p); }

        .results { padding: 1rem; max-width: 800px; margin: 0 auto; }
        .job-card {
            background: var(--surface); padding: 1.5rem; border-radius: 12px;
            margin-bottom: 1rem; border: 1px solid var(--border); transition: 0.3s;
        }
        .job-card:hover { border-color: var(--p); transform: translateY(-2px); }
        .job-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 5px; }
        .job-company { color: var(--p); font-weight: 700; margin-bottom: 10px; display: block; }
        .job-meta { font-size: 0.85rem; color: var(--text-dim); display: flex; gap: 15px; }

        .btn-link {
            display: inline-block; margin-top: 15px; color: white; text-decoration: none;
            background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 8px; font-weight: 700; font-size: 0.8rem;
        }

        .load-more-container { text-align: center; margin-top: 20px; display: none; }
        .btn-more {
            background: transparent; border: 2px solid var(--p); color: var(--p);
            padding: 12px 30px; border-radius: 10px; font-weight: 800; cursor: pointer; transition: 0.3s;
        }

        /* --- STYLE EASTER EGG RGB --- */
        @keyframes rgb-glow {
            0% { border-color: #ff0000; box-shadow: 0 0 20px #ff0000; }
            33% { border-color: #00ff00; box-shadow: 0 0 20px #00ff00; }
            66% { border-color: #0000ff; box-shadow: 0 0 20px #0000ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 20px #ff0000; }
        }

        .momo-active {
            animation: rgb-glow 1.5s infinite linear !important;
            border-width: 3px !important;
        }

        .momo-text {
            background: linear-gradient(to right, red, orange, yellow, green, cyan, blue, violet);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 1rem;
        }

        @media (min-width: 768px) {
            .search-card { display: flex; gap: 15px; align-items: flex-end; }
            .input-group { margin-bottom: 0; }
            .btn-search { width: auto; padding: 14px 30px; }
        }
    </style>
</head>
<body>

<header>
    <div class="brand">M<span>JOB</span></div>
    <div class="by-momo">by Momo</div>
</header>

<div class="search-container">
    <div id="search-card-ui" class="search-card">
        <div class="input-group">
            <label>Métier</label>
            <div class="input-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="q-what" placeholder="ex: Développeur, Design...">
            </div>
        </div>
        <div class="input-group">
            <label>Ville</label>
            <div class="input-wrapper">
                <i class="fas fa-map-marker-alt"></i>
                <input type="text" id="q-where" placeholder="Paris, Lyon, 75...">
            </div>
        </div>
        <button class="btn-search" onclick="initialSearch()">
            <i class="fas fa-bolt"></i>
        </button>
    </div>
</div>

<div id="filters-ui" class="time-filters">
    <button class="filter-btn active" onclick="updateTimeFilter(0, this)">Toutes</button>
    <button class="filter-btn" onclick="updateTimeFilter(2, this)">48 Heures</button>
    <button class="filter-btn" onclick="updateTimeFilter(7, this)">7 Jours</button>
</div>

<div id="results" class="results"></div>

<div id="load-more-wrap" class="load-more-container">
    <button class="btn-more" onclick="loadMore()">Charger plus d'offres</button>
</div>

<script>
    const ID = '48757112'; 
    const KEY = 'a203ff7d66ab6e9f492f053751d9b188';
    let currentPage = 1;
    let maxDays = 0;

    function updateTimeFilter(days, btn) {
        maxDays = days;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        initialSearch();
    }

    async function initialSearch() {
        const query = document.getElementById('q-what').value.toLowerCase().trim();
        
        // --- LOGIQUE EASTER EGG ---
        if (query === 'quiestmomo') {
            showMomo();
            return;
        }

        // Retour au mode normal si on change la recherche
        document.getElementById('search-card-ui').classList.remove('momo-active');
        document.getElementById('filters-ui').style.display = 'flex';

        currentPage = 1;
        document.getElementById('results').innerHTML = '';
        await executeSearch();
    }

    function showMomo() {
        const resDiv = document.getElementById('results');
        const searchCard = document.getElementById('search-card-ui');
        const filters = document.getElementById('filters-ui');
        const moreBtn = document.getElementById('load-more-wrap');

        searchCard.classList.add('momo-active');
        filters.style.display = 'none';
        moreBtn.style.display = 'none';
        
        resDiv.innerHTML = `
            <div class="job-card" style="text-align:center; padding: 3rem;">
                <div class="momo-text">MOMO LE BOSS</div>
                <p style="font-size: 1.2rem; line-height: 1.6;">
                    C'est le génie qui a codé ce site ! <br>
                    Propulsé par le talent pur et beaucoup de café. ☕⚡
                </p>
                <button class="btn-search" style="margin: 20px auto 0;" onclick="location.reload()">Retourner à la réalité</button>
            </div>
        `;
    }

    async function loadMore() {
        currentPage++;
        await executeSearch();
    }

    async function executeSearch() {
        const what = document.getElementById('q-what').value || 'Emploi';
        const where = document.getElementById('q-where').value || '';
        const resDiv = document.getElementById('results');
        const moreBtn = document.getElementById('load-more-wrap');

        if(currentPage === 1) resDiv.innerHTML = '<p style="text-align:center; opacity:0.5;">Scan des offres en cours...</p>';

        try {
            let url = `https://api.adzuna.com/v1/api/jobs/fr/search/${currentPage}?app_id=${ID}&app_key=${KEY}&results_per_page=10&what=${encodeURIComponent(what)}&where=${encodeURIComponent(where)}`;
            if(maxDays > 0) url += `&max_days_old=${maxDays}`;

            const response = await fetch(url);
            const data = await response.json();

            if(currentPage === 1) resDiv.innerHTML = '';

            if(data.results.length === 0) {
                if(currentPage === 1) resDiv.innerHTML = '<p style="text-align:center;">Aucune offre trouvée.</p>';
                moreBtn.style.display = 'none';
                return;
            }

            data.results.forEach(job => {
                const card = document.createElement('div');
                card.className = 'job-card';
                card.innerHTML = `
                    <span class="job-company">${job.company.display_name}</span>
                    <div class="job-title">${job.title}</div>
                    <div class="job-meta">
                        <span><i class="fas fa-location-dot"></i> ${job.location.display_name}</span>
                        <span><i class="fas fa-calendar"></i> ${new Date(job.created).toLocaleDateString()}</span>
                    </div>
                    <a href="${job.redirect_url}" target="_blank" class="btn-link">Détails de l'offre</a>
                `;
                resDiv.appendChild(card);
            });
            moreBtn.style.display = 'block';
        } catch (e) {
            resDiv.innerHTML += '<p style="color:red; text-align:center;">Erreur réseau.</p>';
        }
    }

    document.addEventListener('keypress', (e) => { if(e.key === 'Enter') initialSearch(); });
</script>

</body>
</html>
